<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="妖怪天国"><meta name="theme-color" content="#161311"><meta name="description" content="Yokai Paradise — 妖怪天国：N4 日文練習遊戲"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#161311}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior:none}</style></head><body><title>妖怪天国</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;700&family=Yuji+Syuku&display=swap">
<style>
/* 版型：單欄手機優先；勇者試煉夜版；符紙黃＋朱紅印泥為亮色，溶岩橘只在第二關 */
:root{
  --bg:#161311;--panel:#1F1B18;--panel2:#262119;--ink:#F2ECE4;--dim:#B3A797;--line:#3A322B;
  --accent:#E06A55;--seal:#E06A55;--soft:#3A231E;--navy:#8FA8E0;--ok:#4FA37A;--sakura:#D9738C;--gold:#D4A54A;
  --paper:#F4EFE3;--paper2:#E6DDC8;--paperInk:#1E1A17;--shu:#C8402F;--lava:#FF6A2B;--lava2:#B3200F;
  --grad:linear-gradient(120deg,#E8784F 0%,#DD5A45 45%,#C8402F 100%);
  --fs:"IBM Plex Sans JP","Noto Sans TC",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,monospace;
  --fb:"Yuji Syuku","Noto Sans TC",serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg) radial-gradient(60% 40% at 100% 0%,rgba(224,106,85,.16),transparent 70%) fixed;
  color:var(--ink);font-family:var(--fs);font-size:18px;line-height:1.45;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;border-radius:14px;transition:transform .12s var(--ease),opacity .2s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{display:none;min-height:100%;max-width:520px;margin:0 auto;padding-block:14px 60px}
.screen.on{display:block;animation:slide .52s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.focus{padding-bottom:14px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));flex-direction:column;overflow:hidden}
.screen.focus.on{display:flex}
/* 頂部名片 */
.card-top{display:grid;grid-template-columns:62px 1fr auto;gap:4px 14px;align-items:center;margin-bottom:18px}
.seal{grid-row:span 2;width:62px;height:62px;border-radius:50%;border:3px double var(--seal);display:grid;place-items:center;transform:rotate(-6deg);font-family:var(--fb);color:var(--seal);font-size:28px;line-height:1}
.seal span{transform:translateY(-0.07em)}
h1{margin:0;font-size:24px;line-height:1.15;text-wrap:balance}
h1 .en{display:block;margin-top:3px;font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.tag{color:var(--dim);font-size:15px;margin:0}
.ico{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;padding:0}
.ico svg,.pill svg,.back svg,.say svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-top .ico{color:var(--dim)}
/* 數據膠囊 */
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel) 88%,transparent);font-size:14px;color:var(--dim);white-space:nowrap}
.pill b{font-family:var(--fm);color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px;color:var(--accent)}
/* 關卡方塊 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;border-radius:20px;background:var(--panel);border:1px solid var(--line);text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;aspect-ratio:1/1}
.tile .wm{position:absolute;right:-8px;top:-16px;font-family:var(--fb);font-size:118px;color:var(--ink);opacity:.09;line-height:1;pointer-events:none}
.tile .no{font-family:var(--fm);font-size:12px;letter-spacing:.12em;color:var(--gold)}
.tile h2{margin:0;font-size:20px}
.tile p{margin:0;color:var(--dim);font-size:14px;line-height:1.35}
.tile.stage1,.tile.stage2{grid-column:span 2;aspect-ratio:auto;min-height:124px}
.tile.stage1{background:#241611;border-color:#4a2a22}
.tile.stage1 .wm{color:var(--accent);opacity:.28}
.tile.stage2{background:linear-gradient(180deg,#1f1512 40%,#3a1609);border-color:#5a2a14}
.tile.stage2 .wm{color:var(--lava);opacity:.3}
.note{color:var(--dim);font-size:14px;margin:18px 4px 0}
/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--fm);font-size:14px;color:var(--dim);flex:0 0 auto}
.hp{display:flex;gap:4px}
.hp svg{width:20px;height:20px;fill:var(--accent);stroke:var(--accent)}
.hp svg.off{fill:none;stroke:var(--line)}
.combo{color:var(--gold);font-weight:700;font-size:16px}
.hud .ico{width:36px;height:36px;min-height:36px;color:var(--dim)}
/* 第一關舞台 */
.stage{position:relative;flex:0 0 auto;height:146px;margin:8px 0 4px;border-bottom:1px solid var(--line)}
.yokai{position:absolute;bottom:0;left:0;width:96px;height:120px}
.yokai svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.yokai .acc{fill:rgba(143,168,224,.35)}
.yokai .acc2{fill:var(--accent);stroke:var(--accent)}
.yokai .dot{fill:var(--ink);stroke:none}
.yokai.hop svg{animation:hop .8s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.yokai.hit svg{animation:hit .45s var(--ease)}
@keyframes hit{25%{transform:translateX(-14px) rotate(-12deg);filter:brightness(2.2)}100%{transform:none}}
.yokai.sealed{opacity:.2;transition:opacity .7s}
.yname{position:absolute;left:0;top:-22px;font-size:13px;color:var(--dim);white-space:nowrap}
.torii{position:absolute;right:0;bottom:0;width:44px;height:96px}
.torii svg{width:100%;height:100%;stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 8px;flex:0 0 auto}
.timer i{display:block;height:100%;width:100%;background:var(--grad);transform-origin:left;transition:transform .25s linear}
.prompt{text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto}
.prompt .mean{font-size:26px;font-weight:700;line-height:1.2}
.say{width:40px;height:40px;min-height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--navy);padding:0}
.hint{color:var(--dim);font-size:16px;min-height:1.4em;text-align:center}
.hint b{color:var(--navy);font-weight:600}
.slots{display:flex;gap:6px;justify-content:center;margin:2px 0 0;flex:0 0 auto}
.slot{width:36px;height:42px;border-bottom:2px solid var(--line);display:grid;place-items:end center;font-size:26px;font-weight:700;line-height:1.2}
.slot.cur{border-color:var(--gold)}
.slot.done{color:var(--paper);border-color:var(--ok)}
.slot.bad{border-color:var(--sakura)}
.strk{text-align:center;font-size:14px;color:var(--dim);min-height:1.3em;margin-top:4px;flex:0 0 auto}
.strk b{font-family:var(--fm);color:var(--ink);font-variant-numeric:tabular-nums}
.strk b.ok{color:var(--ok)}.strk b.over{color:var(--sakura)}
.box.good{border-color:var(--gold);border-style:solid;box-shadow:0 0 0 3px rgba(212,165,74,.5),0 0 30px rgba(212,165,74,.7)}
.inkfly{position:fixed;left:0;top:0;z-index:20;pointer-events:none;filter:drop-shadow(0 0 8px rgba(232,205,118,.95)) drop-shadow(0 0 18px rgba(224,106,85,.8))}
.fu{margin:8px auto 6px;padding:12px 10px;background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(30,26,23,.55),inset 0 0 0 6px var(--paper);display:flex;gap:6px;justify-content:center;align-items:center;width:max-content;max-width:100%;flex:0 0 auto}
.fu .head,.fu .foot{font-family:var(--fb);color:var(--paperInk);font-size:15px;writing-mode:vertical-rl;line-height:1.05;display:flex;align-items:center;gap:8px}
.fu .foot::after{content:"封";writing-mode:horizontal-tb;display:grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--shu);border-radius:3px;color:var(--shu);font-size:14px;transform:rotate(-4deg);mix-blend-mode:multiply}
.box{position:relative;border:1.5px dashed rgba(30,26,23,.3);border-radius:4px;background:rgba(255,255,255,.35);touch-action:none}
.box canvas{display:block;width:100%;height:100%}
.box .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fb);color:var(--paperInk);opacity:.28;pointer-events:none;line-height:1}
.box .x{position:absolute;right:6px;top:6px;width:32px;height:32px;min-height:0;border-radius:50%;background:rgba(30,26,23,.75);color:#fff;font-size:16px;line-height:32px;padding:0;display:none}
.box.has .x{display:block}
.box.bad{border-color:#C8402F;background:rgba(200,64,47,.25);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fly{position:fixed;left:0;top:0;z-index:20;font-family:var(--fb);color:var(--paper);line-height:1;pointer-events:none;text-shadow:0 0 10px rgba(232,205,118,.95),0 0 24px rgba(224,106,85,.7)}
.feedback{text-align:center;min-height:1.5em;font-size:16px;color:var(--dim);margin:0 0 6px;flex:0 0 auto}
.feedback.ok{color:var(--ok)}.feedback.no{color:var(--sakura)}
.feedback .ans{font-size:22px;color:var(--ink);font-weight:700}
.actions{display:flex;gap:10px;margin-top:auto;flex:0 0 auto}
.btn{padding:0 16px;border:1px solid var(--line);background:var(--panel);font-size:16px;white-space:nowrap}
.btn.sm{flex:0 0 auto;color:var(--dim)}
.btn.main{flex:1;background:var(--grad);color:#fff;font-weight:700;font-size:18px;border:0;box-shadow:0 6px 18px rgba(221,90,69,.3)}
.btn.main:disabled{opacity:.5}
/* 第二關 溶岩 */
.arena{position:relative;flex:1 1 auto;margin:6px 0 0;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(180deg,transparent 55%,rgba(255,106,43,.10));border:1px solid var(--line);border-bottom:0}
.lava{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,var(--lava) 0%,var(--lava2) 70%);box-shadow:0 -10px 40px rgba(255,106,43,.55)}
.lava::before{content:"";position:absolute;left:-10%;right:-10%;top:-10px;height:20px;background:radial-gradient(12px 10px at 10px 10px,var(--lava) 98%,transparent) 0 0/40px 20px repeat-x;animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(40px)}}
.lava i{position:absolute;bottom:10px;width:10px;height:10px;border-radius:50%;background:#FFC46B;opacity:0;animation:bub 2.6s ease-in infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0) scale(.4)}30%{opacity:.9}100%{opacity:0;transform:translateY(-38px) scale(1.2)}}
.blk{position:absolute;left:0;top:0;width:31%;min-height:58px;padding:7px 6px;border-radius:12px;font-size:16px;font-weight:700;line-height:1.25;text-align:center;will-change:transform}
.blk.zh{background:#2A2F45;border:1.5px solid #5C6B9E;color:#E6EBFF}
.blk.ja{background:#3B2A18;border:1.5px solid #9C7330;color:#FFF1D6}
.blk .lb{display:block;font-family:var(--fm);font-size:10px;font-weight:500;letter-spacing:.14em;opacity:.6;margin-bottom:2px}
.blk .jl{display:block}.blk .rl{display:block;font-size:11px;font-weight:500;opacity:.65;margin-top:1px}.blk .zl{display:block;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,241,214,.18);font-size:14px;font-weight:600;color:#BFD0FF}
.blk.sel{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(212,165,74,.6)}
.blk.wrong{animation:shake .4s;border-color:var(--sakura)}
.blk.burn{transition:opacity .5s,filter .5s;opacity:0;filter:brightness(2) saturate(3) blur(2px)}
.zhfloat{position:fixed;left:0;top:0;z-index:21;font-size:28px;font-weight:700;color:#E6EBFF;text-shadow:0 0 14px rgba(143,168,224,.85),0 2px 8px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
.gem{position:fixed;left:0;top:0;z-index:20;width:40px;height:40px;pointer-events:none}
.gem svg{width:100%;height:100%}
.chest{color:var(--gold)}
/* 結算／妖怪帳 */
.result{text-align:center;padding-top:30px}
.result .big{font-family:var(--fb);font-size:64px;line-height:1;color:var(--seal)}
.result h2{margin:10px 0 4px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left}
.gcard .k{font-size:21px;font-weight:700;min-width:0}
.gcard .m{color:var(--dim);font-size:15px;min-width:0}
.gcard .due{grid-row:span 2;font-family:var(--fm);font-size:13px;color:var(--navy);text-align:right;white-space:nowrap}
.gcard .due.now{color:var(--sakura)}
.empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:16px}
/* 化け術 */
.vq{text-align:center;margin:14px 0 6px}
.vq .verb{font-size:36px;font-weight:700;line-height:1.1}
.vq .form{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;font-size:18px}
.vq .k{color:var(--dim);font-size:15px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{min-height:68px;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:600;border-radius:16px;padding:6px}
.opt.right{background:rgba(79,163,122,.25);border-color:var(--ok)}
.opt.wrong{background:rgba(200,64,47,.25);border-color:#C8402F}
.explain{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--panel2);color:var(--dim);font-size:15px;line-height:1.5;min-height:3.4em;overflow:auto}
.explain b{color:var(--ink)}
.row{display:flex;gap:10px;margin-top:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:15px;padding:0 6px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:15px;transition:all .4s var(--ease);pointer-events:none;white-space:nowrap;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%)}
.study{overflow:auto;flex:1 1 auto;min-height:0;padding:2px 2px 8px}
.study .gcard{grid-template-columns:1fr auto;transition:border-color .3s,background .3s}
.study .gcard.now{border-color:var(--gold);background:#2a2216}
.study .gcard .k{font-size:24px}
.study .say{grid-row:span 2}
.study .pun{grid-column:1/-1;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:14px;color:var(--dim);line-height:1.45}
.study .pun b{color:var(--gold);font-size:16px}
.study .rules{border-color:#4a3a22;background:#211a12}.study .rules b{color:var(--gold)}
.mic{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:14px;white-space:nowrap;overflow:hidden;color:var(--navy);flex:0 0 auto}
.mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.mic.zh{color:var(--gold)}
.mic i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.6)}}
.heard{display:none}
#s-lava .feedback{font-size:14px;min-height:1.4em;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-lava .actions .btn{min-height:44px}
@media (max-height:720px){.stage{height:108px;margin:4px 0 2px}.yokai{width:72px;height:90px}.torii{height:76px;width:36px}.prompt .mean{font-size:22px}.slot{height:32px;font-size:20px}.hint{min-height:0}#s-battle .feedback{font-size:14px;min-height:1.2em}.fu{margin:4px auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-snd" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>

</svg>

<!-- 首頁 -->
<section class="screen on" id="s-home">
  <div class="card-top">
    <div class="seal"><span>封</span></div>
    <h1>妖怪天国<span class="en">Yokai Paradise</span></h1>
    <div style="grid-row:span 2;display:flex;gap:8px"><button class="ico" id="reloadBtn" onclick="hardReload()" aria-label="重新整理，抓最新版" hidden><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button><button class="ico" id="muteHome" onclick="toggleMute()" aria-label="聲音開關"></button></div>
    <p class="tag">妖怪は待ってくれない。<span id="verTag" style="font-family:var(--fm);font-size:12px;opacity:.6"></span></p>
  </div>
  <div class="pills">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V9l6-5 6 5v11"/></svg>封印 <b id="st-sealed">0</b></span>
    <span class="pill"><svg viewBox="0 0 24 24"><use href="#i-gem"/></svg>宝物 <b id="st-gems">0</b></span>
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 10l7-7 7 7"/></svg>今日復活 <b id="st-due">0</b></span>
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>最高連擊 <b id="st-combo">0</b></span>
  </div>
  <div class="tiles">
    <button class="tile stage1" onclick="startBattle()"><span class="wm">書</span><span class="no">第一關 · 單字</span><h2>書道封印</h2><p>妖怪往鳥居衝過來。聽發音、手寫平假名，寫對的字直接打上去。</p></button>
    <button class="tile stage2" onclick="startLava()"><span class="wm">溶</span><span class="no">第二關 · 片語</span><h2>溶岩の試煉</h2><p>日文方塊一直掉，唸出來就消掉、中文意思浮上來。掉進岩漿就溶了。</p></button>

const VERBS=[["たべる",2,"食べる","吃"],["みる",2,"見る","看"],["おきる",2,"起きる","起床"],["ねる",2,"寝る","睡覺"],["おしえる",2,"教える","教"],["わすれる",2,"忘れる","忘記"],["おぼえる",2,"覚える","記住"],["でる",2,"出る","出去"],["あける",2,"開ける","打開"],["かりる",2,"借りる","借入"],
["いく",1,"行く","去"],["かく",1,"書く","寫"],["きく",1,"聞く","聽"],["およぐ",1,"泳ぐ","游泳"],["はなす",1,"話す","說"],["まつ",1,"待つ","等"],["しぬ",1,"死ぬ","死"],["あそぶ",1,"遊ぶ","玩"],["よむ",1,"読む","讀"],["のむ",1,"飲む","喝"],["かえる",1,"帰る","回家"],["はしる",1,"走る","跑"],["しる",1,"知る","知道"],["はいる",1,"入る","進去"],["かう",1,"買う","買"],["あう",1,"会う","見面"],["つかう",1,"使う","使用"],
["する",3,"する","做"],["くる",3,"来る","來"],["べんきょうする",3,"勉強する","學習"]].map(a=>({d:a[0],g:a[1],k:a[2],m:a[3]}));
const ROW={う:["い","わ","え","お","って","った"],く:["き","か","け","こ","いて","いた"],ぐ:["ぎ","が","げ","ご","いで","いだ"],す:["し","さ","せ","そ","して","した"],つ:["ち","た","て","と","って","った"],ぬ:["に","な","ね","の","んで","んだ"],ぶ:["び","ば","べ","ぼ","んで","んだ"],む:["み","ま","め","も","んで","んだ"],る:["り","ら","れ","ろ","って","った"]};
const FORMS=["ます形","ない形","て形","た形","可能形","意向形"];
function conj(d,g,f){
  if(g===3){const stem=d.slice(0,-2);const t=d.endsWith("する")?["します","しない","して","した","できる","しよう"]:["きます","こない","きて","きた","こられる","こよう"];return stem+t[f]}
  if(g===2)return d.slice(0,-1)+["ます","ない","て","た","られる","よう"][f];
  const s=d.slice(0,-1),e=d.slice(-1),r=ROW[e];
  if(f===0)return s+r[0]+"ます";if(f===1)return s+r[1]+"ない";if(f===2)return d==="いく"?"いって":s+r[4];if(f===3)return d==="いく"?"いった":s+r[5];if(f===4)return s+r[2]+"る";return s+r[3]+"う"}
function distract(v,f){const set=new Set(),right=conj(v.d,v.g,f);
  if(v.g===2)set.add(conj(v.d,1,f));if(v.g===1&&v.d.endsWith("る"))set.add(conj(v.d,2,f));
  if(v.g===1&&(f===2||f===3)){const s=v.d.slice(0,-1);["って","いて","んで","して"].forEach(t=>set.add(s+(f===3?t.replace("て","た").replace("で","だ"):t)))}
  if(v.g===3){const stem=v.d.slice(0,-2);(v.d.endsWith("する")?["すります","すらない","すって","すった","すれる","すろう"]:["くります","くらない","くって","くった","くれる","くろう"]).forEach(t=>set.add(stem+t))}
  for(let i=0;i<6;i++)if(i!==f)set.add(conj(v.d,v.g,i));set.delete(right);return shuffle([...set]).slice(0,3)}
const vb={q:[],i:0,combo:0,best:0,score:0,t0:0,raf:0,done:false};
const GNAME=["","第一類（五段）","第二類（る動詞）","第三類（不規則）"];
const VERB_RULES=`<div class="gcard rules"><span class="k" style="font-size:18px">變身規則總表</span><span class="m" style="grid-column:1/-1;line-height:1.7">
<b>第一類（五段）</b>：字尾的假名換段<br>
・ます形：い段＋ます（書く→書きます）<br>・ない形：あ段＋ない（書く→書かない；う→わ：買う→買わない）<br>
・て／た形：う・つ・る→って／った；む・ぶ・ぬ→んで／んだ；く→いて；ぐ→いで；す→して（例外：行く→行って）<br>
・可能形：え段＋る（書く→書ける）<br>・意向形：お段＋う（書く→書こう）<br>
<b>第二類（る動詞）</b>：去掉る，再接 ます／ない／て／た／られる／よう（食べる→食べて）<br>
<b>第三類</b>：整個背<br>する→します・しない・して・した・できる・しよう<br>来る→きます・こない・きて・きた・こられる・こよう<br>
<b>陷阱</b>：帰る・走る・知る・入る 長得像第二類，其實是第一類</span></div>`;
function ruleOnly(v,f){if(v.g===2)return `去掉「る」再接 ${["ます","ない","て","た","られる","よう"][f]}`;if(v.g===3)return v.d.endsWith("する")?"する 整個背":"来る 整個背";
  const e=v.d.slice(-1),ex=v.d==="いく"&&(f===2||f===3)?"（行く是例外）":"";let r=[`「${e}」改成い段＋ます`,`「${e}」改成あ段＋ない`+(e==="う"?"（う→わ）":""),`${e} 結尾→「${ROW[e][4]}」${ex}`,`${e} 結尾→「${ROW[e][5]}」${ex}`,`「${e}」改成え段＋る`,`「${e}」改成お段＋う`][f];
  if(v.d.endsWith("る"))r+="・陷阱字";return r}
function startVerb(){const q=pendGet('v',()=>shuffle(VERBS).slice(0,10).map(v=>({v,f:Math.floor(Math.random()*6)})),l=>l.map(x=>[x.v.d,x.f]),a=>a.map(([d,f])=>{const v=VERBS.find(x=>x.d===d);return v?{v,f}:null}));
  openStudy('番外・化け術 教學',q.map(({v,f})=>{const c=conj(v.d,v.g,f);return {k:`${v.d} → ${c}`,sub:`${v.k}（${v.m}）・${FORMS[f]}`,say:`${v.d}、${c}`,pun:[GNAME[v.g],ruleOnly(v,f)]}}),5000,()=>beginVerb(q),false,{intro:VERB_RULES,tag:'每題會唸原形和變化後的形。不限時，看好了再開始考。'})}
function beginVerb(q){ac();pendClear('v');vb.q=q;Object.assign(vb,{i:0,combo:0,best:0,score:0});go('s-verb');verbShow()}
function verbShow(){const {v,f}=vb.q[vb.i];vb.done=false;document.getElementById('v-count').textContent=`${vb.i+1} / 10`;document.getElementById('v-combo').textContent=`連擊 ${vb.combo}`;document.getElementById('v-score').textContent=`${vb.score} 分`;
  document.getElementById('v-verb').textContent=v.d;document.getElementById('v-k').textContent=`${v.k}（${v.m}）`;document.getElementById('v-form').textContent=FORMS[f];
  const right=conj(v.d,v.g,f);document.getElementById('v-opts').innerHTML=shuffle([right,...distract(v,f)]).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('');
  document.querySelectorAll('#v-opts .opt').forEach(b=>b.onclick=()=>verbPick(b,b.dataset.o));
  document.getElementById('v-exp').textContent='狸葉子放頭上，抽到什麼形就變什麼形。';document.getElementById('v-next').disabled=true;say(v.d);
  vb.t0=performance.now();cancelAnimationFrame(vb.raf);vtick()}
function vtick(){const el=(performance.now()-vb.t0)/6000;document.getElementById('vbar').style.transform=`scaleX(${Math.max(0,1-el)})`;if(el>=1){verbPick(null,null);return}vb.raf=requestAnimationFrame(vtick)}
function explainFor(v,f){const right=conj(v.d,v.g,f);const gname=["","第一類（五段動詞）","第二類（る動詞）","第三類（不規則）"][v.g];let rule;
  if(v.g===2)rule=`去掉「る」再接 ${["ます","ない","て","た","られる","よう"][f]}`;
  else if(v.g===3)rule="する／くる 要整個背，沒有公式";
  else{const e=v.d.slice(-1),ex=v.d==="いく"&&(f===2||f===3)?"，但 いく 是例外":"";rule=[`「${e}」改成い段再接 ます`,`「${e}」改成あ段再接 ない`+(e==="う"?"（う要變わ）":""),`${e} 結尾的て形是「${ROW[e][4]}」${ex}`,`${e} 結尾的た形是「${ROW[e][5]}」${ex}`,`「${e}」改成え段再接 る`,`「${e}」改成お段再接 う`][f]}
  if(v.g===1&&v.d.endsWith("る"))rule+="。長得像る動詞，其實是第一類，陷阱字";
  return `<b>${v.k}</b> 是${gname}：${rule} → <b>${right}</b>`}
function verbPick(btn,ans){if(vb.done)return;vb.done=true;cancelAnimationFrame(vb.raf);const {v,f}=vb.q[vb.i],right=conj(v.d,v.g,f);
  document.querySelectorAll('#v-opts .opt').forEach(b=>{if(b.dataset.o===right)b.classList.add('right');else if(b===btn)b.classList.add('wrong')});const exp=document.getElementById('v-exp');
  if(ans===right){vb.combo++;vb.best=Math.max(vb.best,vb.combo);vb.score+=100+Math.round(Math.max(0,1-(performance.now()-vb.t0)/6000)*50)+vb.combo*10;if(vb.combo>META.best){META.best=vb.combo;save()}SFX.gem();say(right);exp.innerHTML=(vb.combo>=3?`化け術連擊 ×${vb.combo}！`:'ドロン！變身成功。')+' '+explainFor(v,f)}
  else{vb.combo=0;SFX.wrong();say(right);exp.innerHTML=(ans===null?'時間到，葉子掉了。':`變成四不像了，${v.k}都認不出自己。`)+' '+explainFor(v,f)}
  document.getElementById('v-combo').textContent=`連擊 ${vb.combo}`;document.getElementById('v-score').textContent=`${vb.score} 分`;document.getElementById('v-next').disabled=false}
function verbNext(){vb.i++;if(vb.i>=vb.q.length){showResult({big:'化',title:'化け術おしまい',sub:`${vb.score} 分。`,l1:'得分',v1:vb.score,l2:'題數',v2:10,v3:vb.best,again:startVerb});return}verbShow()}
function leaveVerb(){cancelAnimationFrame(vb.raf);go('s-home')}
